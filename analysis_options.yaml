# Static analysis config. Run with `flutter analyze`.
# Project rules: CLAUDE.md. Package-API caveats: AGENTS.md.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # This is a money app talking to a database. A missing await or an
    # unhandled future is a lost order, not a style nit.
    unawaited_futures: error
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - always_declare_return_types
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - use_super_parameters
